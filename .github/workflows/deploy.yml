name: Build and deploy to GitHub Pages

# Lint, test and build on pull requests and on main.
# Deploy only from main. The Pages environment rejects every other branch,
# and configure-pages fails the job when the Pages site does not exist yet.
# That 404 is what failed the 16–17 Oct 2026 runs after the build had succeeded,
# so the Pages steps stay on the deploy path and do not fail the code checks.
# The deploy waits only for the build (about a minute), not for the unit tests
# (about ten): the owner wants each update live at once, and a failing test is
# fixed in a follow-up update (v0.39).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Cancel an outdated pull-request run. Runs on main don't queue behind each
# other's tests: only their deploys take turns (below), and each one finishes.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: [build]
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
